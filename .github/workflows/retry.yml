name: OCI Retry

on:
  schedule:
    - cron: "*/5 19-23,0-2 * * *"   # night: every 5 min (00:30-08:29 IST)
    - cron: "0 3-18 * * *"           # day: hourly (08:30-23:30 IST)
  workflow_dispatch:

concurrency:
  group: oci-retry
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/key.pem
          EOF

          cat > ~/.oci/key.pem <<EOF
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Try to create the instance
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JOB_ID=$(oci resource-manager job create-apply-job \
            --stack-id ${{ secrets.OCI_STACK_ID }} \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED \
            --wait-for-state FAILED \
            --max-wait-seconds 600 \
            --query 'data.id' --raw-output)

          STATE=$(oci resource-manager job get --job-id "$JOB_ID" \
            --query 'data."lifecycle-state"' --raw-output)
          echo "Job $JOB_ID -> $STATE"

          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "Instance created! Disabling this workflow."
            gh workflow disable "${{ github.workflow }}"
            exit 1   # deliberate: makes GitHub email you
          fi

          LOGS=$(oci resource-manager job get-job-logs --job-id "$JOB_ID" --all \
            --query 'data[*].message' 2>/dev/null)

          if echo "$LOGS" | grep -qiE "out of host capacity|out of capacity"; then
            echo "No capacity yet, will retry on next schedule."
            exit 0
          fi

          echo "Non-capacity failure:"
          echo "$LOGS" | tail -n 40
          exit 1